[project]
name = "books-rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "KateySt", email = "kateystetsenko@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "anyio>=4.0",
    "cyclopts>=4.24.0",
    "docling>=2.126.0",
    "docling-core>=2.95.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6",
    "pypdfium2>=4.30",
    "qdrant-client>=1.19.0",
    "redis>=5",
    "tenacity>=9.0.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.57",
    "uvicorn[standard]>=0.52.4",
    "vercel>=0.11.6,<0.12",
    "voyageai>=0.5.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.8",
]
